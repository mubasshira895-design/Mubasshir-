<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Shorten & Share</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .service-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        
        .service-option {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }
        
        .service-option:hover {
            border-color: #667eea;
            background: #f9f9f9;
        }
        
        .service-option.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-shorten {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-shorten:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-copy {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-copy:hover {
            background: #e0e0e0;
        }
        
        .result-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
            display: none;
        }
        
        .result-section.active {
            display: block;
        }
        
        .result-label {
            color: #666;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .result-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
            min-height: 50px;
            display: flex;
            align-items: center;
            color: #667eea;
            font-weight: 600;
        }
        
        .success-message {
            background: #e8f5e9;
            border: 1px solid #4caf50;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
        
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #1565c0;
            line-height: 1.6;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .share-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        
        .share-btn {
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .share-messenger {
            background: #0084ff;
        }
        
        .share-whatsapp {
            background: #25d366;
        }
        
        .share-twitter {
            background: #1da1f2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">✨</div>
            <h1>Share Your Page</h1>
            <p class="subtitle">Get a short link to share on Messenger, TikTok & social media</p>
        </div>
        
        <div class="info-box">
            💡 <strong>Quick tip:</strong> Paste your Chrome link, choose a shortener service, and get a URL perfect for sharing!
        </div>
        
        <div class="input-group">
            <label for="longUrl">Paste your Chrome link:</label>
            <textarea id="longUrl" placeholder="Paste your data:text/html link here..."></textarea>
        </div>
        
        <div class="input-group">
            <label>Choose Shortener Service:</label>
            <div class="service-selector">
                <div class="service-option active" onclick="selectService(this, 'tinyurl')">
                    📎 TinyURL
                </div>
                <div class="service-option" onclick="selectService(this, 'is')">
                    🔗 is.gd
                </div>
            </div>
        </div>
        
        <input type="hidden" id="selectedService" value="tinyurl">
        
        <div class="button-group">
            <button class="btn-shorten" onclick="shortenLink()">✨ Generate Short Link</button>
            <button class="btn-copy" onclick="copyLink()">📋 Copy</button>
        </div>
        
        <div class="result-section" id="resultSection">
            <div class="result-label">Your Short Link:</div>
            <div class="result-box" id="shortLinkBox">
                <span class="loading" style="display:none;" id="spinner"></span>
                <span id="linkText"></span>
            </div>
            
            <div class="success-message">
                ✓ Short link ready! Perfect for sharing! 🎉
            </div>
            
            <div style="margin-top: 20px;">
                <p style="color: #666; font-size: 13px; margin-bottom: 10px;"><strong>📱 Share Directly:</strong></p>
                <div class="share-buttons">
                    <button class="share-btn share-messenger" onclick="shareOn('messenger')">💬 Messenger</button>
                    <button class="share-btn share-whatsapp" onclick="shareOn('whatsapp')">📞 WhatsApp</button>
                    <button class="share-btn share-twitter" onclick="shareOn('twitter')">𝕏 Tweet</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let generatedShortLink = '';
        
        function selectService(element, service) {
            document.querySelectorAll('.service-option').forEach(e => {
                e.classList.remove('active');
            });
            element.classList.add('active');
            document.getElementById('selectedService').value = service;
        }
        
        function shortenLink() {
            const longUrl = document.getElementById('longUrl').value.trim();
            const service = document.getElementById('selectedService').value;
            
            if (!longUrl) {
                alert('Please paste a URL first!');
                return;
            }
            
            const spinner = document.getElementById('spinner');
            const linkText = document.getElementById('linkText');
            
            spinner.style.display = 'inline-block';
            linkText.textContent = 'Creating short link...';
            
            // Show result section
            const resultSection = document.getElementById('resultSection');
            resultSection.classList.add('active');
            
            try {
                if (service === 'tinyurl') {
                    shortenWithTinyURL(longUrl, spinner, linkText);
                } else if (service === 'is') {
                    shortenWithIsGd(longUrl, spinner, linkText);
                }
            } catch (error) {
                spinner.style.display = 'none';
                linkText.textContent = 'Error: ' + error.message;
            }
        }
        
        function shortenWithTinyURL(url, spinner, linkText) {
            // Using TinyURL API
            fetch('https://tinyurl.com/api-create.php?url=' + encodeURIComponent(url))
                .then(response => response.text())
                .then(data => {
                    generatedShortLink = data.trim();
                    spinner.style.display = 'none';
                    linkText.textContent = generatedShortLink;
                })
                .catch(error => {
                    spinner.style.display = 'none';
                    linkText.textContent = 'Error: ' + error.message + '. Try another service.';
                });
        }
        
        function shortenWithIsGd(url, spinner, linkText) {
            // Using is.gd API
            fetch('https://is.gd/?url=' + encodeURIComponent(url) + '&format=json')
                .then(response => response.json())
                .then(data => {
                    if (data.shorturl) {
                        generatedShortLink = data.shorturl;
                        spinner.style.display = 'none';
                        linkText.textContent = generatedShortLink;
                    } else {
                        throw new Error('Failed to shorten');
                    }
                })
                .catch(error => {
                    spinner.style.display = 'none';
                    linkText.textContent = 'Error: ' + error.message + '. Try TinyURL instead.';
                });
        }
        
        function copyLink() {
            if (!generatedShortLink) {
                alert('Please generate a short link first!');
                return;
            }
            
            navigator.clipboard.writeText(generatedShortLink).then(() => {
                alert('✓ Link copied! Ready to share! 🎉');
            }).catch(err => {
                const textarea = document.createElement('textarea');
                textarea.value = generatedShortLink;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('✓ Link copied! Ready to share! 🎉');
            });
        }
        
        function shareOn(platform) {
            if (!generatedShortLink) {
                alert('Please generate a short link first!');
                return;
            }
            
            const text = "Check out this amazing page! ❤️";
            const url = encodeURIComponent(generatedShortLink);
            const message = encodeURIComponent(text + " " + generatedShortLink);
            
            let shareUrl = '';
            
            if (platform === 'messenger') {
                shareUrl = 'https://www.facebook.com/dialog/send?app_id=1234&link=' + url + '&redirect_uri=https://facebook.com';
            } else if (platform === 'whatsapp') {
                shareUrl = 'https://wa.me/?text=' + message;
            } else if (platform === 'twitter') {
                shareUrl = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + url;
            }
            
            if (shareUrl) {
                window.open(shareUrl, '_blank', 'width=600,height=400');
            }
        }
    </script>
</body>
</html>
